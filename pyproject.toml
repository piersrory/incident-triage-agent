[project]
name = "incident-triage-agent"
version = "0.1.0"
description = "An agent that investigates an alert and decides whether to wake a person, measured on scripted incidents"
requires-python = ">=3.13"
dependencies = ["pydantic>=2.9", "pyyaml>=6.0"]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
